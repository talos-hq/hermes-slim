name: slim-install-audit

# Installs hermes-slim for real on Windows and macOS (x64 and arm64) and audits the
# result: every binary signed, everything prepackaged in one zstd bundle, downloads in
# parallel over HTTP ranges. Meta issue #138; the checks live in slim/audit_install.py.
# The user explicitly asked for this workflow.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to audit"
        default: latest
  schedule:
    - cron: "41 8 * * *"
  release:
    types: [published]
  pull_request:
    branches: [main]
    paths:
      - slim/install.sh
      - slim/install.ps1
      - slim/audit_install.py
      - slim/macho_signatures.py
      - slim/tests/range_server.py
      - slim/tests/install_ps1_test.ps1
      - .github/workflows/slim-install-audit.yml

permissions:
  contents: read

concurrency:
  group: slim-install-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: audit (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest }
          - { name: windows-arm64, os: windows-11-arm }
          - { name: macos-x64, os: macos-15-intel }
          - { name: macos-arm64, os: macos-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      # install.ps1 under Windows PowerShell 5.1, the one `irm ... | iex` users get, against
      # a local range server that breaks the connection every way a bad network does.
      - name: install.ps1 over a bad connection
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File slim/tests/install_ps1_test.ps1 -Python python
      - name: Install and audit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || 'latest' }}
          # Pull requests audit their own installer; other runs also try the public one-liner.
          PUBLIC: ${{ github.event_name != 'pull_request' && '--public-installer' || '' }}
        run: |
          python slim/audit_install.py --version "$VERSION" --work "$RUNNER_TEMP/audit" \
            --report "$GITHUB_STEP_SUMMARY" $PUBLIC
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: install-audit-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/audit/*.log
            ${{ runner.temp }}/audit/mirror/*.log
          if-no-files-found: ignore
