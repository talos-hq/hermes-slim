name: slim-bundle

# Build the hermes-slim bundle natively on every target, then install and
# smoke-test it the way a client would (slim/smoke_test.py). Tags v* publish
# the bundles as a GitHub release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  # OIDC federation for Azure Artifact Signing (no client secret).
  id-token: write

concurrency:
  group: slim-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s slim/tests -v

  # macOS ARM runners are capacity-limited for PR builds: the job is cancelled ~15 min after
  # queueing WITHOUT ever starting (runner_name "", steps: [], and this file declares no
  # `timeout-minutes`), which fails the run for a capacity reason no code change can fix.
  # Measured 2026-11-03: main run 41725637224 (15m01s, empty runner), 41725164140 (15m02s),
  # 41729388188 (15m01s), while the same job takes ~3m22s when a runner is free (41543140935).
  #
  # Two fixes that do NOT work, both measured here: `timeout-minutes` cannot reach a job that never
  # runs, and `continue-on-error` does not neutralise a CANCELLED job (41729388188 still failed).
  # A job-level `if:` cannot read `matrix` ("context \"matrix\" is not allowed here"), so the leg
  # list is computed instead: PRs drop darwin-arm64 unless the PR opts in with the
  # `ci:bundle-macos` label; pushes to main and tag builds always build every leg.
  legs:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.gen.outputs.include }}
    steps:
      - id: gen
        env:
          EVENT: ${{ github.event_name }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          python3 - "$GITHUB_OUTPUT" <<'PY'
          import json
          import os
          import sys

          legs = [
              {"target": "win32-x64", "os": "windows-latest"},
              {"target": "darwin-x64", "os": "macos-15-intel"},
              {"target": "darwin-arm64", "os": "macos-latest"},
              {"target": "linux-x64", "os": "ubuntu-latest"},
              {"target": "linux-arm64", "os": "ubuntu-24.04-arm"},
              {"target": "linux-x64-musl", "os": "ubuntu-latest", "container": "alpine:3.22"},
          ]
          labels = os.environ.get("LABELS", "").split(",")
          wants_arm = os.environ.get("EVENT") != "pull_request" or "ci:bundle-macos" in labels
          if not wants_arm:
              legs = [leg for leg in legs if leg["target"] != "darwin-arm64"]
          with open(sys.argv[1], "a", encoding="utf-8") as out:
              out.write("include=" + json.dumps(legs) + "\n")
          print(f"bundle legs: {[leg['target'] for leg in legs]}")
          PY

  bundle:
    needs: [unit, legs]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.legs.outputs.include) }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
      # Windows signing runs on every non-PR build (main pushes and v* tags, which the Azure
      # federated credential trusts) and fails closed. Pull requests get no OIDC trust and skip it.
      SIGN_WINDOWS: ${{ matrix.target == 'win32-x64' && github.event_name != 'pull_request' }}
    steps:
      - name: Alpine prerequisites
        if: matrix.container
        shell: sh
        run: apk add --no-cache bash python3 git github-cli tar zstd build-base curl
      - uses: actions/checkout@v4
        with:
          # build_bundle.py stamps the version from `git describe`: it needs every commit and
          # tag, not every blob (a full clone of this fork stalled the alpine job for 15+ min).
          fetch-depth: 0
          filter: blob:none
      - name: Host python
        id: py
        run: |
          for c in python3 python; do
            if command -v $c >/dev/null && $c -c 'import sys; sys.exit(sys.version_info < (3, 11))'; then echo "bin=$c" >> "$GITHUB_OUTPUT"; break; fi
          done
      - name: Fetch hermes-slim/wheels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p wheels
          gh release download latest -R hermes-slim/wheels -D wheels --pattern '*.whl' || echo "no extra wheels"
          ls -l wheels
      - name: Stage bundle
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ${{ steps.py.outputs.bin }} slim/build_bundle.py --target ${{ matrix.target }} --wheels wheels --work "$RUNNER_TEMP/hs-work" --stage-only
      # Smart App Control (on by default on new Windows 11 installs) refuses unsigned
      # binaries, the wheels' .pyd/.dll included. The interpreter is python.org's
      # (PSF-signed); everything stage listed as unsigned is signed here with our
      # Azure Artifact Signing certificate profile.
      - name: Require Azure signing secrets
        if: env.SIGN_WINDOWS == 'true'
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
        run: |
          missing=()
          for name in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_SIGNING_ENDPOINT AZURE_SIGNING_ACCOUNT AZURE_SIGNING_PROFILE; do
            [ -z "${!name}" ] && missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Azure Artifact Signing secrets missing: ${missing[*]}"
            exit 1
          fi
      - name: Azure login (OIDC)
        if: env.SIGN_WINDOWS == 'true'
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5  # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Sign Windows binaries
        if: env.SIGN_WINDOWS == 'true'
        uses: azure/artifact-signing-action@208f8af4bf26cf2af8597424e3cb5582801523ba  # v2.0.0
        with:
          # Authenticate with the Azure CLI session from the OIDC login above; no client secret.
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-catalog: ${{ runner.temp }}/hs-work/unsigned.txt
          file-digest: SHA256
          timestamp-digest: SHA256
      - name: Verify every Windows binary is validly signed
        if: matrix.target == 'win32-x64'
        shell: pwsh
        run: |
          $bad = Get-ChildItem -Recurse -File "$env:RUNNER_TEMP/hs-work/hermes-slim" -Include *.exe,*.dll,*.pyd |
            Get-AuthenticodeSignature | Where-Object Status -ne 'Valid'
          $bad | ForEach-Object { Write-Host "$($_.Status)  $($_.Path)" }
          if ($bad) {
            # Releases must run under Smart App Control; only PR builds (no OIDC trust) may warn.
            if ($env:SIGN_WINDOWS -eq 'true') { throw "$(@($bad).Count) binaries are not validly signed" }
            Write-Host "::warning::$(@($bad).Count) binaries unsigned: this bundle will not run under Smart App Control"
          }
      - name: Package bundle
        run: ${{ steps.py.outputs.bin }} slim/build_bundle.py --target ${{ matrix.target }} --out dist --work "$RUNNER_TEMP/hs-work" --package-only
      - name: Static zstd for clients without one
        if: matrix.target == 'linux-x64-musl'
        run: sh slim/build_zstd.sh dist
      - name: Smoke test
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: ${{ steps.py.outputs.bin }} slim/smoke_test.py "$(ls dist/hermes-slim-*-${{ matrix.target }}.zip dist/hermes-slim-*-${{ matrix.target }}.tar.zst 2>/dev/null | head -1)"
      - uses: actions/upload-artifact@v4
        with:
          name: hermes-slim-${{ matrix.target }}
          path: dist/
          retention-days: 3

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" -R "${{ github.repository }}" --generate-notes dist/*
