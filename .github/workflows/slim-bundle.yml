name: slim-bundle

# Build the hermes-slim bundle natively on every target, then install and
# smoke-test it the way a client would (slim/smoke_test.py). Tags v* publish
# the bundles as a GitHub release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      arm_image:
        description: "Runner image for the darwin-arm64 leg (default: slim/ci_legs.py DEFAULT_ARM_IMAGE)"
        required: false
        default: ""

permissions:
  contents: write
  # OIDC federation for Azure Artifact Signing (no client secret).
  id-token: write

concurrency:
  group: slim-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s slim/tests -v
      - name: Set up soldr
        uses: forge-ci/setup-soldr@271d19234f51ed1a908ee6ecdd721a75dff1dbb6 # v0
        env:
          SOLDR_GITHUB_TOKEN: ${{ github.token }}
      - name: hermes-slim-unpack tests
        working-directory: slim/unpack
        run: |
          soldr cargo fmt --check
          soldr cargo clippy --locked --all-targets -- -D warnings
          soldr cargo test --locked

  # The leg list lives in slim/ci_legs.py: a job-level `if:` cannot read `matrix`, so the matrix
  # is computed here. Unlabelled PRs skip darwin-arm64 with a notice (GitHub's arm64 pool cancels
  # jobs without assigning a runner); `bundle-report` names those cancels instead of hiding them.
  legs:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.gen.outputs.include }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: slim/ci_legs.py
          sparse-checkout-cone-mode: false
      - id: gen
        env:
          EVENT: ${{ github.event_name }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          ARM_IMAGE: ${{ inputs.arm_image }}
        run: python3 slim/ci_legs.py matrix

  bundle:
    needs: [unit, legs]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.legs.outputs.include) }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
      # Windows signing runs on every non-PR build (main pushes and v* tags, which the Azure
      # federated credential trusts) and fails closed. Pull requests get no OIDC trust and skip it.
      SIGN_WINDOWS: ${{ startsWith(matrix.target, 'win32-') && github.event_name != 'pull_request' }}
    steps:
      - name: Alpine prerequisites
        if: matrix.container
        shell: sh
        run: apk add --no-cache bash python3 git github-cli tar zstd build-base curl
      - uses: actions/checkout@v4
        with:
          # build_bundle.py stamps the version from `git describe`: it needs every commit and
          # tag, not every blob (a full clone of this fork stalled the alpine job for 15+ min).
          fetch-depth: 0
          filter: blob:none
      - name: Host python
        id: py
        run: |
          for c in python3 python; do
            if command -v $c >/dev/null && $c -c 'import sys; sys.exit(sys.version_info < (3, 11))'; then echo "bin=$c" >> "$GITHUB_OUTPUT"; break; fi
          done
      - name: Fetch hermes-slim/wheels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p wheels
          gh release download latest -R hermes-slim/wheels -D wheels --pattern '*.whl' || echo "no extra wheels"
          ls -l wheels
      - name: Stage bundle
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ${{ steps.py.outputs.bin }} slim/build_bundle.py --target ${{ matrix.target }} --wheels wheels --work "$RUNNER_TEMP/hs-work" --stage-only
      # Built before signing so the macOS helper is signed and notarized with the bundle.
      - name: Standalone zstd for clients without one
        if: matrix.target == 'linux-x64-musl' || startsWith(matrix.target, 'darwin-')
        run: sh slim/build_zstd.sh dist
      # hermes-slim-unpack (slim/unpack): the installers' parallel unpacker, built natively per
      # leg before signing, so it is signed (and notarized) with the bundle. Linux builds are
      # static musl binaries from the glibc legs; the Alpine bundle uses linux-x64's.
      - name: Set up soldr
        if: ${{ !matrix.container }}
        uses: forge-ci/setup-soldr@271d19234f51ed1a908ee6ecdd721a75dff1dbb6 # v0
        env:
          SOLDR_GITHUB_TOKEN: ${{ github.token }}
      - name: Build hermes-slim-unpack
        if: ${{ !matrix.container }}
        run: |
          target="${{ matrix.target }}"
          case "$target" in
            win32-*)
              out="$RUNNER_TEMP/hs-work/helper"
              printf 'helper\\hermes-slim-unpack-%s.exe\n' "$target" >> "$RUNNER_TEMP/hs-work/unsigned.txt" ;;
            linux-*)
              # zstd's C sources need a musl C compiler for the static build.
              sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends musl-tools
              out=dist ;;
            *) out=dist ;;
          esac
          ${{ steps.py.outputs.bin }} slim/build_unpack.py "$target" "$out"
      # Gatekeeper, the .pkg path and notarization need every Mach-O signed with our
      # Developer ID, hardened runtime and a secure timestamp (#140). Builds that publish
      # (main pushes, v* tags) fail closed without the org secrets; PRs from forks get no
      # secrets and only warn.
      - name: Import Developer ID certificate
        id: macsign
        if: startsWith(matrix.target, 'darwin-')
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_NOTARY_USER: ${{ secrets.APPLE_NOTARY_USER }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          EVENT: ${{ github.event_name }}
        run: |
          missing=()
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_NOTARY_USER APPLE_NOTARY_PASSWORD; do
            [ -z "${!name}" ] && missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            if [ "$EVENT" = pull_request ]; then
              echo "::warning::macOS signing secrets unavailable (${missing[*]}): this PR's darwin bundle stays unsigned"
              echo "sign=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::macOS signing/notarization secrets missing: ${missing[*]}"
            exit 1
          fi
          p12="$RUNNER_TEMP/cert.p12"
          printf '%s' "$CSC_LINK" | base64 --decode > "$p12"
          kc="$RUNNER_TEMP/signing.keychain-db"
          pw="$(uuidgen)"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          security import "$p12" -k "$kc" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pw" "$kc" >/dev/null
          # shellcheck disable=SC2046 # the existing search list must split
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm -f "$p12"
          identity="$(security find-identity -v -p codesigning "$kc" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')"
          test -n "$identity" || { echo "::error::no Developer ID Application identity in CSC_LINK"; exit 1; }
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "sign=true" >> "$GITHUB_OUTPUT"
      - name: Sign and notarize macOS binaries
        if: steps.macsign.outputs.sign == 'true'
        env:
          APPLE_NOTARY_USER: ${{ secrets.APPLE_NOTARY_USER }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: |
          python3 slim/macos/sign_tree.py --entitlements slim/macos/entitlements.plist \
            "$RUNNER_TEMP/hs-work/hermes-slim" dist/zstd-${{ matrix.target }} dist/hermes-slim-unpack-${{ matrix.target }}
          # The helpers' checksums must describe the signed bytes.
          for h in zstd-${{ matrix.target }} hermes-slim-unpack-${{ matrix.target }}; do
            (cd dist && shasum -a 256 "$h" > "$h.sha256")
          done
      - name: Verify every Mach-O is Developer ID signed
        if: startsWith(matrix.target, 'darwin-')
        env:
          SIGNED: ${{ steps.macsign.outputs.sign }}
        run: |
          if ! python3 slim/macho_signatures.py "$RUNNER_TEMP/hs-work/hermes-slim" --list --fail-unsigned ||
             ! python3 slim/macho_signatures.py dist/hermes-slim-unpack-${{ matrix.target }} --list --fail-unsigned; then
            [ "$SIGNED" != true ] || { echo "::error::Mach-O binaries left without a Developer ID signature"; exit 1; }
            echo "::warning::unsigned darwin bundle (PR without signing secrets)"
          fi
      # install.ps1 unpacks the .tar.zst bundle with this helper and tar.exe (#141). It runs
      # before anything else in the release, so it is signed with the bundle's binaries.
      - name: Standalone zstd for Windows clients
        if: startsWith(matrix.target, 'win32-')
        run: |
          ${{ steps.py.outputs.bin }} slim/zstd_windows.py "$RUNNER_TEMP/hs-work/helper"
          printf 'helper\\zstd-win32-x64.exe\n' >> "$RUNNER_TEMP/hs-work/unsigned.txt"
      # Smart App Control (on by default on new Windows 11 installs) refuses unsigned
      # binaries, the wheels' .pyd/.dll included. The interpreter is python.org's
      # (PSF-signed); everything stage listed as unsigned is signed here with our
      # Azure Artifact Signing certificate profile.
      - name: Require Azure signing secrets
        if: env.SIGN_WINDOWS == 'true'
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
        run: |
          missing=()
          for name in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_SIGNING_ENDPOINT AZURE_SIGNING_ACCOUNT AZURE_SIGNING_PROFILE; do
            [ -z "${!name}" ] && missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Azure Artifact Signing secrets missing: ${missing[*]}"
            exit 1
          fi
      - name: Azure login (OIDC)
        if: env.SIGN_WINDOWS == 'true'
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5  # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Sign Windows binaries
        if: env.SIGN_WINDOWS == 'true'
        uses: azure/artifact-signing-action@208f8af4bf26cf2af8597424e3cb5582801523ba  # v2.0.0
        with:
          # Authenticate with the Azure CLI session from the OIDC login above; no client secret.
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-catalog: ${{ runner.temp }}/hs-work/unsigned.txt
          file-digest: SHA256
          timestamp-digest: SHA256
      - name: Verify every Windows binary is validly signed
        if: startsWith(matrix.target, 'win32-')
        shell: pwsh
        run: |
          $bad = Get-ChildItem -Recurse -File "$env:RUNNER_TEMP/hs-work/hermes-slim", "$env:RUNNER_TEMP/hs-work/helper" -Include *.exe,*.dll,*.pyd |
            Get-AuthenticodeSignature | Where-Object Status -ne 'Valid'
          $bad | ForEach-Object { Write-Host "$($_.Status)  $($_.Path)" }
          if ($bad) {
            # Releases must run under Smart App Control; only PR builds (no OIDC trust) may warn.
            if ($env:SIGN_WINDOWS -eq 'true') { throw "$(@($bad).Count) binaries are not validly signed" }
            Write-Host "::warning::$(@($bad).Count) binaries unsigned: this bundle will not run under Smart App Control"
          }
      # Signing rewrote binaries in pm-store (rg, git's DLLs); PM's recorded digests must
      # describe the shipped bytes, or `hermes pm install` replaces them with unsigned ones (#142).
      - name: Re-record pm-store digests over the signed bytes
        run: |
          b="$RUNNER_TEMP/hs-work/hermes-slim"
          py="$b/python/bin/python3"; [ -e "$py" ] || py="$b/python/python.exe"
          PYTHONPATH="$b/app" HERMES_HOME="$RUNNER_TEMP/pm-home" "$py" slim/pm_tools.py reseal "$b"
      - name: Package bundle
        run: ${{ steps.py.outputs.bin }} slim/build_bundle.py --target ${{ matrix.target }} --out dist --work "$RUNNER_TEMP/hs-work" --package-only
      - name: Publish the Windows zstd helper
        if: matrix.target == 'win32-x64'
        run: |
          cp "$RUNNER_TEMP/hs-work/helper/zstd-win32-x64.exe" dist/
          # The checksum describes the signed bytes.
          (cd dist && sha256sum zstd-win32-x64.exe > zstd-win32-x64.exe.sha256)
      - name: Publish the Windows unpacker
        if: startsWith(matrix.target, 'win32-')
        run: |
          u=hermes-slim-unpack-${{ matrix.target }}.exe
          cp "$RUNNER_TEMP/hs-work/helper/$u" dist/
          (cd dist && sha256sum "$u" > "$u.sha256")
      # Informational: the runner's real filesystem and antivirus, old unpack against new.
      - name: Unpack timing
        if: ${{ !matrix.container }}
        run: |
          for archive in dist/hermes-slim-*-${{ matrix.target }}.tar.zst; do :; done
          unpacker=dist/hermes-slim-unpack-${{ matrix.target }}
          [ -f "$unpacker" ] || unpacker="$unpacker.exe"
          zstd="$RUNNER_TEMP/hs-work/helper/zstd-win32-x64.exe"; [ -f "$zstd" ] || zstd="dist/zstd-${{ matrix.target }}"
          [ -f "$zstd" ] || zstd=zstd
          chmod +x "$zstd" "$unpacker" 2>/dev/null || true
          ${{ steps.py.outputs.bin }} slim/bench_unpack.py "$archive" "$unpacker" --zstd "$zstd"
      # A private X display for the smoke test's computer-use step (list_windows + a screenshot through
      # Hermes' computer_use tool layer against the bundled cua-driver). The libs are cua-driver's own.
      - name: Computer-use test display
        if: startsWith(matrix.target, 'linux-') && !matrix.container
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xterm libx11-6 libxi6 libxtst6 libxkbcommon0
      - name: Smoke test
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          # Prefer the .tar.zst; a win32-x64 build also writes a transitional .zip.
          archive=""
          for f in dist/hermes-slim-*-${{ matrix.target }}.tar.zst dist/hermes-slim-*-${{ matrix.target }}.zip; do
            if [ -f "$f" ]; then archive="$f"; break; fi
          done
          helper="$RUNNER_TEMP/hs-work/helper/zstd-win32-x64.exe"
          if [ -f "$helper" ] && [ ! -f dist/zstd-win32-x64.exe ]; then
            # win32-arm64 unpacks with the x64 helper that the win32-x64 leg publishes; for
            # this smoke run, stand this leg's signed copy beside the archive, outside dist/.
            smoke="$RUNNER_TEMP/smoke"
            mkdir -p "$smoke"
            cp "$archive" "$archive.sha256" "$helper" dist/hermes-slim-unpack-* "$smoke/"
            (cd "$smoke" && sha256sum zstd-win32-x64.exe > zstd-win32-x64.exe.sha256)
            archive="$smoke/$(basename "$archive")"
          fi
          ${{ steps.py.outputs.bin }} slim/smoke_test.py "$archive"
      - uses: actions/upload-artifact@v4
        with:
          name: hermes-slim-${{ matrix.target }}
          path: dist/
          retention-days: 3

  bundle-report:
    if: always() && needs.legs.result == 'success'
    needs: [legs, bundle]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: slim/ci_legs.py
          sparse-checkout-cone-mode: false
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: python3 slim/ci_legs.py report

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: slim/release_manifest.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Installers resolve assets from this CDN-served file instead of the rate-limited API (#146).
      - name: Write the release manifest
        run: |
          python3 slim/release_manifest.py dist --tag "${{ github.ref_name }}" > hermes-slim-manifest.txt
          mv hermes-slim-manifest.txt dist/
          cat dist/hermes-slim-manifest.txt
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" -R "${{ github.repository }}" --generate-notes dist/*
