name: slim-macos-installer

# Nightly: build the universal hermes-slim macOS installer (.pkg carrying both the
# darwin-arm64 and darwin-x64 bundles), sign + notarize it with our Developer ID
# credentials when they are available, then install it on a real Apple Silicon
# runner and a real Intel runner and verify each got its native bundle.
# Design and expected results: slim/macos/HANDOFF.md.

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      require_signing:
        description: "Fail if the package cannot be signed and notarized"
        type: boolean
        default: false
  pull_request:
    branches: [main]
    paths:
      - slim/macos/**
      - slim/install.sh
      - .github/workflows/slim-macos-installer.yml

permissions:
  contents: read

concurrency:
  group: slim-macos-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, os: blacksmith-12vcpu-macos-latest }
          - { target: darwin-x64, os: macos-15-intel }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults: { run: { shell: bash } }
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Fetch hermes-slim/wheels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p wheels
          gh release download latest -R hermes-slim/wheels -D wheels --pattern '*.whl' || echo "no extra wheels"
      - name: Build bundle
        run: |
          uname -m
          if [ '${{ matrix.target }}' = darwin-arm64 ]; then test "$(uname -m)" = arm64; fi
          python3 slim/build_bundle.py --target ${{ matrix.target }} --wheels wheels --work "$RUNNER_TEMP/hs-work" --stage-only
          python3 slim/build_bundle.py --target ${{ matrix.target }} --out dist --work "$RUNNER_TEMP/hs-work" --package-only
          ls -l dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundle-${{ matrix.target }}
          path: dist/*.tar.zst*
          retention-days: 3

  pkg:
    needs: bundle
    # Package assembly and signing do not require an ARM64 host.
    runs-on: macos-15-intel
    environment: release-signing
    timeout-minutes: 60
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: bundle-*
          path: dist
          merge-multiple: true
      - name: Import Developer ID Installer certificate
        id: sign
        env:
          # A .p12 holding "Developer ID Installer" (productsign). CSC_LINK may hold only the
          # Application cert; the step reports which identities it found.
          INSTALLER_P12: ${{ secrets.CSC_INSTALLER_LINK || secrets.CSC_LINK }}
          INSTALLER_P12_PASSWORD: ${{ secrets.CSC_INSTALLER_KEY_PASSWORD || secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          REQUIRE: ${{ inputs.require_signing || false }}
        run: |
          if [ -z "$INSTALLER_P12" ]; then
            [ "$REQUIRE" = true ] && { echo "::error::no signing certificate secret"; exit 1; }
            echo "::warning::no signing secrets; building an unsigned package"; exit 0
          fi
          kc="$RUNNER_TEMP/sign.keychain-db"; pw="$(uuidgen)"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          printf '%s' "$INSTALLER_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$INSTALLER_P12_PASSWORD" -T /usr/bin/productsign -T /usr/bin/pkgbuild
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security find-identity -v "$kc"
          id="$(security find-identity -v "$kc" | sed -n 's/.*"\(Developer ID Installer: [^"]*\)".*/\1/p' | head -1)"
          if [ -z "$id" ]; then
            [ "$REQUIRE" = true ] && { echo "::error::no 'Developer ID Installer' identity in the certificate secret"; exit 1; }
            echo "::warning::no 'Developer ID Installer' identity; building an unsigned package"; exit 0
          fi
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          {
            echo "PKG_SIGN_IDENTITY=$id"
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8"
            echo "NOTARY_KEY_ID=$APPLE_API_KEY_ID"
            echo "NOTARY_ISSUER=$APPLE_API_ISSUER"
          } >> "$GITHUB_ENV"
      - name: Build universal package
        run: |
          uname -m
          sh slim/macos/build_pkg.sh dist "$RUNNER_TEMP/Hermes-Slim.pkg"
          mkdir out
          mv "$RUNNER_TEMP/Hermes-Slim.pkg" out/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Hermes-Slim-pkg
          path: out/Hermes-Slim.pkg
          retention-days: 7

  verify:
    needs: pkg
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: blacksmith-12vcpu-macos-latest, arch: arm64, target: darwin-arm64 }
          - { os: macos-15-intel, arch: x86_64, target: darwin-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: slim/macos
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Hermes-Slim-pkg
      - name: Install and verify
        env:
          EXPECT_ARCH: ${{ matrix.arch }}
          EXPECT_TARGET: ${{ matrix.target }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: bash slim/macos/verify_pkg.sh Hermes-Slim.pkg
      - name: Install log
        if: always()
        run: sudo cat /var/log/hermes-slim-install.log || true
