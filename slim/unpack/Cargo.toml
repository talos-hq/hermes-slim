[package]
name = "hermes-slim-unpack"
version = "0.1.0"
edition = "2021"
publish = false
description = "Unpacks a hermes-slim .tar.zst bundle with parallel zstd decoders and parallel file writers"
license = "MIT"

# Standalone: not a member of any other workspace in this repository.
[workspace]

[dependencies]
tar = { version = ">=0.4.44, <0.5", default-features = false }
zstd = { version = ">=0.13.3, <0.14", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
